<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presupuestador Eléctrico</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; margin: 0; }
    .container { max-width: 1000px; margin: auto; background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); padding-bottom: 16px; margin-bottom: 20px; }
    header h1 { margin: 0; color: var(--primary); font-size: 24px; }
    
    .grid-header { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .input-group { display: flex; flex-direction: column; }
    .input-group label { font-size: 13px; font-weight: 600; margin-bottom: 4px; color: #475569; }
    .input-group input, .input-group textarea { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px; }
    th { background: #f1f5f9; padding: 10px; text-align: left; font-weight: 600; border-bottom: 2px solid var(--border); }
    td { padding: 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    
    input[type="number"], input[type="text"] {
      width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 14px;
    }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    
    .btn { padding: 8px 16px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); color: white; padding: 5px 10px; font-size: 12px; }
    .btn-secondary { background: #64748b; color: white; }
    
    .actions { display: flex; gap: 10px; margin-bottom: 20px; }
    
    .summary-section { display: grid; grid-template-columns: 1fr 340px; gap: 30px; margin-top: 10px; }
    .totals-box { background: #f8fafc; border: 1px solid var(--border); border-radius: 8px; padding: 15px; }
    .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
    .total-row.big { font-size: 18px; font-weight: bold; border-top: 2px solid var(--border); padding-top: 10px; color: var(--primary); }
    
    @media print {
      body { background: white; padding: 0; }
      .container { box-shadow: none; padding: 0; border: none; }
      .actions, .btn-danger, th:last-child, td:last-child { display: none; }
      input, textarea { border: none !important; padding: 0 !important; background: transparent !important; }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div>
      <h1>Presupuesto Eléctrico</h1>
      <p style="margin: 4px 0 0; color: #64748b; font-size: 14px;">Servicio Técnico e Instalaciones</p>
    </div>
    <div style="text-align: right;">
      <label><strong>Fecha:</strong></label>
      <input type="date" id="docDate" style="border: 1px solid var(--border); padding: 5px; border-radius: 4px;">
    </div>
  </header>

  <!-- Datos del Cliente y Trabajo -->
  <div class="grid-header">
    <div class="input-group">
      <label>Cliente / Empresa:</label>
      <input type="text" placeholder="Ej: Juan Pérez">
    </div>
    <div class="input-group">
      <label>Teléfono / Contacto:</label>
      <input type="text" placeholder="Ej: +54 9 11 1234-5678">
    </div>
    <div class="input-group" style="grid-column: span 2;">
      <label>Descripción del Trabajo / Ubicación:</label>
      <input type="text" placeholder="Ej: Cambio de térmica general y recableado de cocina">
    </div>
  </div>

  <!-- Tabla de Repuestos -->
  <table id="partsTable">
    <thead>
      <tr>
        <th style="width: 15%;">Código</th>
        <th style="width: 35%;">Descripción Repuesto/Material</th>
        <th style="width: 10%;">Cant.</th>
        <th style="width: 15%;">P. Unit. ($)</th>
        <th style="width: 10%;">Desc. (%)</th>
        <th style="width: 10%;" class="text-right">Subtotal</th>
        <th style="width: 5%;" class="text-center">X</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <!-- Fila por defecto -->
      <tr>
        <td><input type="text" placeholder="Ej: TM-25A" class="part-code"></td>
        <td><input type="text" placeholder="Termomagnética 2x25A" class="part-desc"></td>
        <td><input type="number" min="1" value="1" class="part-qty" oninput="calculate()"></td>
        <td><input type="number" min="0" step="0.01" value="0.00" class="part-price" oninput="calculate()"></td>
        <td><input type="number" min="0" max="100" value="0" class="part-disc" oninput="calculate()"></td>
        <td class="text-right part-subtotal">$0.00</td>
        <td class="text-center"><button class="btn btn-danger" onclick="removeRow(this)">✕</button></td>
      </tr>
    </tbody>
  </table>

  <div class="actions">
    <button class="btn btn-primary" onclick="addRow()">+ Agregar Repuesto</button>
    <button class="btn btn-secondary" onclick="exportToCSV()">Exportar a Excel (.csv)</button>
    <button class="btn btn-secondary" onclick="window.print()">Imprimir / Guardar PDF</button>
  </div>

  <!-- Resumen y Totales -->
  <div class="summary-section">
    <div>
      <div class="input-group" style="margin-bottom: 12px;">
        <label>Mano de Obra ($):</label>
        <input type="number" id="laborCost" value="0" min="0" step="0.01" oninput="calculate()" placeholder="Monto por mano de obra">
      </div>
      <div class="input-group">
        <label>Observaciones / Garantía:</label>
        <textarea rows="3" placeholder="Ej: Validez del presupuesto: 10 días. Garantía de instalación: 6 meses."></textarea>
      </div>
    </div>

    <div class="totals-box">
      <div class="total-row">
        <span>Subtotal Repuestos:</span>
        <strong id="subtotalPartsText">$0.00</strong>
      </div>
      <div class="total-row">
        <span>
          Gastos de Compra/Logística (%):
          <input type="number" id="expensesPct" value="10" min="0" max="100" style="width: 60px; display: inline-block; padding: 2px 4px;" oninput="calculate()">
        </span>
        <span id="expensesAmountText">$0.00</span>
      </div>
      <div class="total-row">
        <span>Mano de Obra:</span>
        <strong id="laborText">$0.00</strong>
      </div>
      <div class="total-row big">
        <span>TOTAL FINAL:</span>
        <span id="finalTotal">$0.00</span>
      </div>
    </div>
  </div>
</div>

<script>
  // Poner fecha de hoy por defecto
  document.getElementById('docDate').valueAsDate = new Date();

  function addRow() {
    const tbody = document.getElementById('tableBody');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" placeholder="Código" class="part-code"></td>
      <td><input type="text" placeholder="Descripción" class="part-desc"></td>
      <td><input type="number" min="1" value="1" class="part-qty" oninput="calculate()"></td>
      <td><input type="number" min="0" step="0.01" value="0.00" class="part-price" oninput="calculate()"></td>
      <td><input type="number" min="0" max="100" value="0" class="part-disc" oninput="calculate()"></td>
      <td class="text-right part-subtotal">$0.00</td>
      <td class="text-center"><button class="btn btn-danger" onclick="removeRow(this)">✕</button></td>
    `;
    tbody.appendChild(tr);
  }

  function removeRow(btn) {
    const tbody = document.getElementById('tableBody');
    if (tbody.rows.length > 1) {
      btn.closest('tr').remove();
      calculate();
    } else {
      alert("Debe haber al menos un ítem.");
    }
  }

  function formatMoney(amount) {
    return '$' + amount.toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function calculate() {
    const rows = document.querySelectorAll('#tableBody tr');
    let totalRepuestos = 0;

    rows.forEach(row => {
      const qty = parseFloat(row.querySelector('.part-qty').value) || 0;
      const price = parseFloat(row.querySelector('.part-price').value) || 0;
      const disc = parseFloat(row.querySelector('.part-disc').value) || 0;

      // Subtotal con descuento aplicado: (Cant * Precio) * (1 - Desc / 100)
      const subtotalSinDesc = qty * price;
      const subtotal = subtotalSinDesc * (1 - (disc / 100));

      row.querySelector('.part-subtotal').textContent = formatMoney(subtotal);
      totalRepuestos += subtotal;
    });

    // Gastos de compras
    const expensesPct = parseFloat(document.getElementById('expensesPct').value) || 0;
    const expensesAmount = totalRepuestos * (expensesPct / 100);

    // Mano de obra
    const labor = parseFloat(document.getElementById('laborCost').value) || 0;

    // Total general
    const total = totalRepuestos + expensesAmount + labor;

    // Actualizar visualmente
    document.getElementById('subtotalPartsText').textContent = formatMoney(totalRepuestos);
    document.getElementById('expensesAmountText').textContent = formatMoney(expensesAmount);
    document.getElementById('laborText').textContent = formatMoney(labor);
    document.getElementById('finalTotal').textContent = formatMoney(total);
  }

  function exportToCSV() {
    let csv = "Codigo;Descripcion;Cantidad;Precio Unitario;Descuento %;Subtotal\n";
    const rows = document.querySelectorAll('#tableBody tr');
    
    rows.forEach(row => {
      const code = row.querySelector('.part-code').value.replace(/;/g, ' ');
      const desc = row.querySelector('.part-desc').value.replace(/;/g, ' ');
      const qty = row.querySelector('.part-qty').value;
      const price = row.querySelector('.part-price').value;
      const disc = row.querySelector('.part-disc').value;
      const subtotal = row.querySelector('.part-subtotal').textContent.replace('$', '').trim();
      csv += `${code};${desc};${qty};${price};${disc}%;${subtotal}\n`;
    });

    const expensesPct = document.getElementById('expensesPct').value;
    const expensesAmount = document.getElementById('expensesAmountText').textContent.replace('$', '').trim();
    const labor = document.getElementById('laborCost').value;
    const total = document.getElementById('finalTotal').textContent.replace('$', '').trim();

    csv += `\n;;;;Gastos de compra (${expensesPct}%);${expensesAmount}\n`;
    csv += `;;;;Mano de Obra;${labor}\n`;
    csv += `;;;;TOTAL GENERAL;${total}\n`;

    const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.setAttribute("download", "presupuesto_electrico.csv");
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  calculate();
</script>
</body>
</html>
